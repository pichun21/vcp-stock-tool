<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VCP 股票健檢器</title>
<style>
:root{--bg:#f5f4ef;--card:#fff;--ink:#20231f;--muted:#70756e;--line:#dddcd4;--good:#2f7d52;--warn:#a06a14;--bad:#a33d36}
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:1040px;margin:42px auto;padding:0 18px}.head{display:flex;justify-content:space-between;align-items:end;gap:20px}
h1{margin:0;font-size:34px}.sub{color:var(--muted);margin-top:6px}.search{display:flex;gap:8px;margin:28px 0 18px}
input,button{font:inherit;border-radius:12px;border:1px solid var(--line);padding:13px 15px}input{flex:1;background:white;font-size:17px}
button{background:#20231f;color:#fff;border:0;cursor:pointer;font-weight:700;min-width:110px}.grid{display:grid;grid-template-columns:1.35fr .65fr;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 5px 20px #00000008}
.topline{display:flex;justify-content:space-between;gap:12px;align-items:center}.ticker{font-size:25px;font-weight:800}.badge{padding:7px 10px;border-radius:999px;background:#eee;font-weight:700}
.score{font-size:44px;font-weight:900;margin:8px 0}.stars{font-size:21px;letter-spacing:2px}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}
.metric{padding:13px;background:#f7f7f3;border-radius:12px}.metric b{display:block;font-size:20px;margin-top:4px}.muted{color:var(--muted);font-size:13px}
canvas{width:100%;height:360px;border-radius:12px;background:#fcfcfa;margin-top:14px}.checks{display:grid;gap:10px;margin-top:12px}
.check{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding-bottom:9px}.good{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.note{font-size:13px;color:var(--muted);line-height:1.55;margin-top:16px}.error{padding:12px;border-radius:10px;background:#fff0ed;color:#8d302b;display:none;margin-bottom:12px}
@media(max-width:760px){.grid{grid-template-columns:1fr}.head{display:block}h1{font-size:29px}}
</style></head>
<body><div class="wrap">
<div class="head"><div><h1>VCP 股票健檢器</h1><div class="sub">輸入台股代號，自動檢查趨勢、波動收縮、量能與 Pivot。</div></div><div class="muted">V1 · 日線</div></div>
<div class="search"><input id="symbol" value="2330" placeholder="例如：2330、5274"><button id="go">開始分析</button></div>
<div id="err" class="error"></div>
<div class="grid">
<div class="card"><div class="topline"><div><div class="ticker" id="title">等待分析</div><div class="muted" id="period"></div></div><div class="badge" id="state">—</div></div>
<canvas id="chart" width="720" height="360"></canvas><div class="note">圖：近約 120 個交易日收盤價；C1 紅、C2 藍、C3 綠（若有 C4 則為紫色），分別標示各次回檔區間與跌幅；虛線為估算 Pivot。VCP 是型態辨識，不代表突破一定成功。</div></div>
<div class="card"><div class="muted">VCP 綜合評分</div><div class="score" id="score">—</div><div class="stars" id="stars">☆☆☆☆☆</div>
<div class="metrics"><div class="metric"><span class="muted">Pivot</span><b id="pivot">—</b></div><div class="metric"><span class="muted">距 Pivot</span><b id="dist">—</b></div><div class="metric"><span class="muted">收縮序列</span><b id="contracts">—</b></div><div class="metric"><span class="muted">量能</span><b id="volume">—</b></div></div>
<div class="checks" id="checks"></div><div class="note" id="summary">輸入股票代號後開始。</div></div>
</div></div>
<script>
const $=id=>document.getElementById(id), API='https://api.finmindtrade.com/api/v4/data';
function pct(x){return (x>=0?'+':'')+x.toFixed(1)+'%'}
function sma(a,n){return a.map((_,i)=>i<n-1?null:a.slice(i-n+1,i+1).reduce((x,y)=>x+y,0)/n)}
function analyze(d){
 const close=d.map(x=>+x.close), vol=d.map(x=>+x.Trading_Volume||+x.Trading_money||0), n=close.length, ma50=sma(close,50), ma150=sma(close,150);
 let trend=ma50[n-1]&&ma150[n-1]&&close[n-1]>ma50[n-1]&&ma50[n-1]>ma150[n-1];
 // Detect local peaks/troughs, then derive recent peak-to-trough contractions.
 let piv=[]; for(let i=3;i<n-3;i++){let w=close.slice(i-3,i+4); if(close[i]===Math.max(...w))piv.push({i,t:'H',p:close[i]}); if(close[i]===Math.min(...w))piv.push({i,t:'L',p:close[i]})}
 piv=piv.filter((x,i)=>!i||x.t!==piv[i-1].t);
 let drops=[]; for(let i=0;i<piv.length-1;i++) if(piv[i].t==='H'&&piv[i+1].t==='L') drops.push({h:piv[i],l:piv[i+1],drop:(piv[i].p-piv[i+1].p)/piv[i].p*100});
 drops=drops.slice(-4); let seq=drops.map(x=>x.drop), contracting=seq.length>=2&&seq.slice(1).every((x,i)=>x<seq[i]*1.12);
 let recent=close.slice(-35), pivot=Math.max(...recent.slice(0,-3)), last=close[n-1], distance=(last/pivot-1)*100;
 let v20=vol.slice(-20).reduce((a,b)=>a+b,0)/20, v60=vol.slice(-60,-20).reduce((a,b)=>a+b,0)/Math.max(1,vol.slice(-60,-20).length), dry=v20<v60*.85;
 let breakout=last>pivot, breakoutVol=vol[n-1]>v20*1.35;
 let pts=0; if(trend)pts++; if(seq.length>=2)pts++; if(contracting)pts++; if(dry)pts++; if((breakout&&breakoutVol)||(!breakout&&distance>-8))pts++;
 let state=breakout?(breakoutVol?'🟢 帶量突破':'🟡 突破待確認'):(distance>-5?'🟡 接近 Pivot':'⚪ 整理觀察');
 return {close,trend,seq,drops,contracting,dry,pivot,last,distance,breakout,breakoutVol,pts,state,dates:d.map(x=>x.date)}
}
function draw(a){
 let c=$('chart'),x=c.getContext('2d'),W=c.width,H=c.height;x.clearRect(0,0,W,H);let vals=a.close.slice(-120),min=Math.min(...vals)*.97,max=Math.max(...vals)*1.03,pad=35;
 let X=i=>pad+i*(W-2*pad)/(vals.length-1),Y=v=>H-pad-(v-min)*(H-2*pad)/(max-min);
 x.strokeStyle='#deded8';x.lineWidth=1;for(let k=0;k<5;k++){let y=pad+k*(H-2*pad)/4;x.beginPath();x.moveTo(pad,y);x.lineTo(W-pad,y);x.stroke()}
 x.strokeStyle='#252824';x.lineWidth=2;x.beginPath();vals.forEach((v,i)=>i?x.lineTo(X(i),Y(v)):x.moveTo(X(i),Y(v)));x.stroke();
 x.setLineDash([7,5]);x.strokeStyle='#9a6a1c';x.beginPath();x.moveTo(pad,Y(a.pivot));x.lineTo(W-pad,Y(a.pivot));x.stroke();x.setLineDash([]);
 x.fillStyle='#9a6a1c';x.font='12px system-ui';x.fillText('Pivot '+a.pivot.toFixed(2),pad+5,Y(a.pivot)-7);
 // Mark detected pullbacks C1, C2, C3... on the displayed 120-day window.
 let offset=Math.max(0,a.close.length-120);
 (a.drops||[]).forEach((d,k)=>{
   let hi=d.h.i-offset, lo=d.l.i-offset;
   if(hi<0||lo<0||hi>=vals.length||lo>=vals.length)return;
   let x1=X(hi),y1=Y(d.h.p),x2=X(lo),y2=Y(d.l.p);
   const cColors=['#d1495b','#2d70b3','#2f8f5b','#8a5fb5'];
   const cc=cColors[k % cColors.length];
   x.strokeStyle=cc;x.lineWidth=2.5;x.beginPath();x.moveTo(x1,y1);x.lineTo(x2,y2);x.stroke();
   x.fillStyle=cc;x.strokeStyle=cc;x.lineWidth=1;
   x.beginPath();x.arc(x1,y1,4.5,0,Math.PI*2);x.fill();x.stroke();
   x.beginPath();x.arc(x2,y2,4.5,0,Math.PI*2);x.fill();x.stroke();
   x.fillStyle=cc;x.font='bold 13px system-ui';
   let label=`C${k+1}  -${d.drop.toFixed(1)}%`;
   x.fillText(label,Math.min(x1+5,W-pad-82),Math.max(pad+13,(y1+y2)/2));
 });
}
async function getStockName(s){
 try{
  let r=await fetch(`${API}?dataset=TaiwanStockInfo`);
  let j=await r.json();
  if(j.data){
   let row=j.data.find(x=>String(x.stock_id)===s);
   if(row) return row.stock_name || row.stock_id;
  }
 }catch(e){}
 return '';
}
async function run(){
 let s=$('symbol').value.trim(); if(!/^\d{4,6}$/.test(s)){showErr('請輸入台股代號，例如 2330。');return}
 $('go').disabled=true;$('go').textContent='分析中…';$('err').style.display='none';
 let end=new Date(), start=new Date();start.setDate(end.getDate()-420);let f=d=>d.toISOString().slice(0,10);
 try{
  let u=`${API}?dataset=TaiwanStockPrice&data_id=${s}&start_date=${f(start)}&end_date=${f(end)}`;
  let r=await fetch(u),j=await r.json(); if(!r.ok||!j.data||j.data.length<160)throw new Error(j.msg||'歷史資料不足');
  let d=j.data,a=analyze(d),stockName=await getStockName(s); $('title').textContent=stockName ? `${stockName}（${s}）` : `${s} · 台股`;$('period').textContent=d[0].date+' ～ '+d[d.length-1].date;$('state').textContent=a.state;
  $('score').textContent=a.pts+'/5';$('stars').textContent='★'.repeat(a.pts)+'☆'.repeat(5-a.pts);$('pivot').textContent=a.pivot.toFixed(2);$('dist').textContent=pct(a.distance);
  $('contracts').textContent=a.seq.length?a.seq.map(x=>'-'+x.toFixed(0)+'%').join(' → '):'未辨識';$('volume').textContent=a.dry?'量縮 ✓':'未明顯量縮';
  let rows=[['中期上升趨勢',a.trend],['至少兩次價格收縮',a.seq.length>=2],['回檔幅度逐步縮小',a.contracting],['近期成交量乾涸',a.dry],['接近／突破 Pivot',a.distance>-8]];
  $('checks').innerHTML=rows.map(r=>`<div class="check"><span>${r[0]}</span><b class="${r[1]?'good':'bad'}">${r[1]?'✓':'×'}</b></div>`).join('');
  $('summary').textContent=a.breakout?(a.breakoutVol?'目前已突破估算 Pivot，且量能擴張；仍應先設定失敗突破的退出條件。':'價格已越過 Pivot，但量能尚未明顯確認。'):(a.distance>-5?'價格已靠近 Pivot，可列入觀察，不必預先猜突破。':'目前離 Pivot 還有距離，先觀察型態是否繼續收緊。');
  draw(a)
 }catch(e){showErr('抓不到資料：'+e.message+'。若瀏覽器阻擋跨網域請求，可改用本機伺服器開啟本頁。')}
 finally{$('go').disabled=false;$('go').textContent='開始分析'}
}
function showErr(t){$('err').textContent=t;$('err').style.display='block'}
$('go').onclick=run;$('symbol').onkeydown=e=>{if(e.key==='Enter')run()};run();
</script></body></html>

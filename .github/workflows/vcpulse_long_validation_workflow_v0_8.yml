name: VCPulse Long OOS Validation v0.8

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "長期驗證起始日期 YYYY-MM-DD"
        required: true
        default: "2025-09-10"
      end_date:
        description: "長期驗證結束日期 YYYY-MM-DD"
        required: true
        default: "2026-09-10"

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy requests
      - name: Run frozen long validation
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          python tools/vcpulse_long_validation_v0_8.py \
            --theme-db data/vcpulse_themes_v2_6_score_calibration.json \
            --start "${{ inputs.start_date }}" \
            --end "${{ inputs.end_date }}" \
            --cache-dir backtest_cache \
            --out-dir long_validation_output \
            --setup-threshold 70 \
            --heat-max 45 \
            --cooldown 5
      - uses: actions/upload-artifact@v4
        with:
          name: vcpulse-long-oos-validation-v0-8
          path: long_validation_output/

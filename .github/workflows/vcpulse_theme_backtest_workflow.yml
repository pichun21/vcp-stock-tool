name: VCPulse Theme Backtest

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "回測起始日期 YYYY-MM-DD"
        required: true
        default: "2026-08-14"
      end_date:
        description: "回測結束日期 YYYY-MM-DD"
        required: true
        default: "2026-09-10"

jobs:
  backtest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy requests
      - name: Run 20-day backtest
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          python tools/vcpulse_theme_historical_runner_v0_2.py \
            --theme-db data/vcpulse_themes_v2_6_score_calibration.json \
            --start "${{ inputs.start_date }}" \
            --end "${{ inputs.end_date }}" \
            --cache-dir backtest_cache \
            --out-dir backtest_output
      - uses: actions/upload-artifact@v4
        with:
          name: vcpulse-theme-backtest
          path: backtest_output/

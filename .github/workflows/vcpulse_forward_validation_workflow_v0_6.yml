name: VCPulse Forward Validation v0.6

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "驗證起始日期 YYYY-MM-DD"
        required: true
        default: "2026-07-16"
      end_date:
        description: "驗證結束日期 YYYY-MM-DD"
        required: true
        default: "2026-09-10"

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy requests
      - name: Rebuild v0.5 40-day history
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          python tools/vcpulse_theme_historical_runner_v0_5.py \
            --theme-db data/vcpulse_themes_v2_6_score_calibration.json \
            --start "${{ inputs.start_date }}" \
            --end "${{ inputs.end_date }}" \
            --cache-dir backtest_cache \
            --out-dir backtest_output
      - name: Run forward validation
        run: |
          python tools/vcpulse_forward_validation_v0_6.py \
            --daily backtest_output/backtest_daily.json \
            --out-dir forward_validation_output \
            --setup-threshold 70 \
            --heat-max 45
      - uses: actions/upload-artifact@v4
        with:
          name: vcpulse-forward-validation-v0-6
          path: |
            backtest_output/
            forward_validation_output/

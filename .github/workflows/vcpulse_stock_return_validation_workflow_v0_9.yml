name: VCPulse Stock Return Validation v0.9

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "驗證起始日期 YYYY-MM-DD"
        required: true
        default: "2025-09-10"
      end_date:
        description: "驗證結束日期 YYYY-MM-DD"
        required: true
        default: "2026-09-10"

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy requests
      - name: Rebuild frozen long history
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          python tools/vcpulse_theme_historical_runner_v0_8_long.py \
            --theme-db data/vcpulse_themes_v2_6_score_calibration.json \
            --start "${{ inputs.start_date }}" \
            --end "${{ inputs.end_date }}" \
            --cache-dir backtest_cache \
            --out-dir backtest_output \
            --max-days 0
      - name: Validate stock returns
        run: |
          python tools/vcpulse_stock_return_validation_v0_9.py \
            --daily backtest_output/backtest_daily.json \
            --cache-dir backtest_cache \
            --out-dir stock_return_validation_output \
            --setup-threshold 70 \
            --heat-max 45 \
            --cooldown 5
      - uses: actions/upload-artifact@v4
        with:
          name: vcpulse-stock-return-validation-v0-9
          path: |
            backtest_output/
            stock_return_validation_output/

name: Market Pulse Daily (Beta)

on:
  workflow_dispatch:
  schedule:
    - cron: "10 7 * * 1-5"
      timezone: "Asia/Taipei"

permissions:
  contents: write

concurrency:
  group: market-pulse-daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Build Market Pulse
        run: python tools/market_pulse_daily_v0_6.py
      - name: QA
        run: |
          python - <<'PY'
          import json
          x=json.load(open('market_pulse.json',encoding='utf-8'))
          assert x.get('status')=='ok', x
          assert 0 <= float(x['score']) <= 100
          for k in ['tx_night','nasdaq','sox','us10y','brent','usdtwd']:
              assert k in x['signals'], k
          print('Market Pulse QA PASS:', x['score'], x['state'])
          PY
      - name: Commit Market Pulse
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market_pulse.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: update Market Pulse"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
            git push origin HEAD:main && exit 0
            sleep $((attempt * 3))
          done
          exit 1

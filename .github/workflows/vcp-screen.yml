name: Daily VCP Screener

on:
  workflow_dispatch:
    inputs:
      run_type:
        description: "更新模式"
        required: true
        default: "intraday_TW"
        type: choice
        options:
          - intraday_TW
          - intraday_US
          - official_TW
          - official_US
          - benchmark_TW
          - both
  schedule:
    # 台股盤中完整重掃：09:10、09:30、10:00、10:30、11:00、11:30、12:00、12:30、13:00
    - cron: "10,30 9 * * 1-5"
      timezone: "Asia/Taipei"
    - cron: "0,30 10-12 * * 1-5"
      timezone: "Asia/Taipei"
    - cron: "0 13 * * 1-5"
      timezone: "Asia/Taipei"

    # 台股正式收盤
    - cron: "10 18 * * 1-5"
      timezone: "Asia/Taipei"

    # 台股收盤大盤補更新：TPEx 官方櫃買指數有時晚於 18:10 才發布
    # 只更新 benchmark，不重掃約 2,000 檔股票
    - cron: "15 19 * * 1-5"
      timezone: "Asia/Taipei"

    # 美股盤中完整重掃：美東時間 09:30～15:30，每 1 小時一次
    # 使用 America/New_York，夏令/冬令時間會自動跟著美股當地時間切換
    - cron: "30 9-15 * * 1-5"
      timezone: "America/New_York"

    # 美股正式收盤
    - cron: "10 7 * * 2-6"
      timezone: "Asia/Taipei"

permissions:
  contents: write

# Avoid multiple VCP screen jobs writing screening.json to main at the same time.
# cancel-in-progress=false means later runs wait instead of killing the current scan.
concurrency:
  group: vcp-screen-main
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Important for Re-run: always start from the latest main instead of
          # reusing the original run's older commit SHA.
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Choose market and snapshot
        id: target
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "${{ inputs.run_type }}" in
              intraday_TW) echo "market=TW" >> "$GITHUB_OUTPUT"; echo "snapshot=intraday" >> "$GITHUB_OUTPUT" ;;
              intraday_US) echo "market=US" >> "$GITHUB_OUTPUT"; echo "snapshot=intraday" >> "$GITHUB_OUTPUT" ;;
              official_TW) echo "market=TW" >> "$GITHUB_OUTPUT"; echo "snapshot=official" >> "$GITHUB_OUTPUT" ;;
              official_US) echo "market=US" >> "$GITHUB_OUTPUT"; echo "snapshot=official" >> "$GITHUB_OUTPUT" ;;
              benchmark_TW) echo "market=TW" >> "$GITHUB_OUTPUT"; echo "snapshot=benchmark" >> "$GITHUB_OUTPUT" ;;
              both) echo "market=both" >> "$GITHUB_OUTPUT"; echo "snapshot=auto" >> "$GITHUB_OUTPUT" ;;
            esac
          elif [ "${{ github.event.schedule }}" = "10 18 * * 1-5" ]; then
            echo "market=TW" >> "$GITHUB_OUTPUT"
            echo "snapshot=official" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "15 19 * * 1-5" ]; then
            echo "market=TW" >> "$GITHUB_OUTPUT"
            echo "snapshot=benchmark" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "10 7 * * 2-6" ]; then
            echo "market=US" >> "$GITHUB_OUTPUT"
            echo "snapshot=official" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 9-15 * * 1-5" ]; then
            echo "market=US" >> "$GITHUB_OUTPUT"
            echo "snapshot=intraday" >> "$GITHUB_OUTPUT"
          else
            echo "market=TW" >> "$GITHUB_OUTPUT"
            echo "snapshot=intraday" >> "$GITHUB_OUTPUT"
          fi

      - name: Run VCP screener
        run: |
          echo "Market: ${{ steps.target.outputs.market }}"
          echo "Snapshot: ${{ steps.target.outputs.snapshot }}"
          if [ "${{ steps.target.outputs.snapshot }}" = "benchmark" ]; then
            python scanner.py --market TW --benchmark-only
          else
            python scanner.py --market "${{ steps.target.outputs.market }}" --snapshot "${{ steps.target.outputs.snapshot }}"
          fi

      - name: Update TDCC whale holdings
        if: ${{ steps.target.outputs.market == 'TW' || steps.target.outputs.market == 'both' }}
        run: |
          python tdcc_whales.py

      - name: Commit screening result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screening.json tdcc_whales.json
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "chore: update VCP screening (${{ steps.target.outputs.snapshot }} / ${{ steps.target.outputs.market }})"

            # main may move while the ~3 minute scan is running (for example,
            # a manual index.html update). Rebase onto the newest main before
            # pushing, and retry a few times if another commit lands meanwhile.
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                echo "Rebase conflict; aborting to protect main."
                git rebase --abort || true
                exit 1
              fi

              if git push origin HEAD:main; then
                echo "Push succeeded on attempt $attempt."
                exit 0
              fi

              echo "Push raced with another update; retrying ($attempt/3)..."
              sleep $((attempt * 3))
            done

            echo "Push failed after 3 attempts."
            exit 1
          fi

name: Daily VCP Screener

on:
  workflow_dispatch:
    inputs:
      run_type:
        description: "更新模式"
        required: true
        default: "intraday_TW"
        type: choice
        options:
          - intraday_TW
          - intraday_US
          - official_TW
          - official_US
          - both
  schedule:
    - cron: "10 18 * * 1-5"
      timezone: "Asia/Taipei"
    - cron: "10 7 * * 2-6"
      timezone: "Asia/Taipei"

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Choose market and snapshot
        id: target
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "${{ inputs.run_type }}" in
              intraday_TW) echo "market=TW" >> "$GITHUB_OUTPUT"; echo "snapshot=intraday" >> "$GITHUB_OUTPUT" ;;
              intraday_US) echo "market=US" >> "$GITHUB_OUTPUT"; echo "snapshot=intraday" >> "$GITHUB_OUTPUT" ;;
              official_TW) echo "market=TW" >> "$GITHUB_OUTPUT"; echo "snapshot=official" >> "$GITHUB_OUTPUT" ;;
              official_US) echo "market=US" >> "$GITHUB_OUTPUT"; echo "snapshot=official" >> "$GITHUB_OUTPUT" ;;
              both) echo "market=both" >> "$GITHUB_OUTPUT"; echo "snapshot=auto" >> "$GITHUB_OUTPUT" ;;
            esac
          elif [ "${{ github.event.schedule }}" = "10 18 * * 1-5" ]; then
            echo "market=TW" >> "$GITHUB_OUTPUT"
            echo "snapshot=official" >> "$GITHUB_OUTPUT"
          else
            echo "market=US" >> "$GITHUB_OUTPUT"
            echo "snapshot=official" >> "$GITHUB_OUTPUT"
          fi

      - name: Run VCP screener
        run: |
          echo "Market: ${{ steps.target.outputs.market }}"
          echo "Snapshot: ${{ steps.target.outputs.snapshot }}"
          python scanner.py --market "${{ steps.target.outputs.market }}" --snapshot "${{ steps.target.outputs.snapshot }}"

      - name: Commit screening result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screening.json
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "chore: update VCP screening (${{ steps.target.outputs.snapshot }} / ${{ steps.target.outputs.market }})"
            git push
          fi
